name: colaqui

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: colaqui
      POSTGRES_USER: colaqui
      POSTGRES_PASSWORD: colaqui_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colaqui -d colaqui"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: colaqui/minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      target: server
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: colaqui/minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: .
      dockerfile: docker/minio/Dockerfile
      target: client
      args:
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/colaqui
      "

volumes:
  postgres-data:
  minio-data:

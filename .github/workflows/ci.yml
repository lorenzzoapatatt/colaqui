name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://colaqui:colaqui_dev@localhost:55432/colaqui
      AUTH_RESET_SECRET: ci-only-reset-secret-with-at-least-32-characters
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: colaqui
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      MAX_PHOTO_BYTES: "10485760"
      MAX_PHOTOS_PER_PRODUCT: "20"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: colaqui
          POSTGRES_USER: colaqui
          POSTGRES_PASSWORD: colaqui_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U colaqui -d colaqui"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Start MinIO
        run: |
          docker compose build --pull minio minio-init
          docker compose up --detach --wait --wait-timeout 120 minio
          docker compose run --rm --no-deps -T minio-init

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build

      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end test
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
